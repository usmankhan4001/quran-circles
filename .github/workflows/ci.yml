name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The poster renderer's tests render with real headless Chromium. Install the headless
      # shell that its pinned playwright-core expects, plus the system libraries it needs.
      - name: Install Chromium headless shell for the poster renderer tests
        run: pnpm --filter @qc/poster-renderer exec playwright-core install --with-deps --only-shell chromium
      - run: pnpm test
      - run: pnpm format:check
