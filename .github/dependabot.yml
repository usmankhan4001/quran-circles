# Dependency updates arrive as pull requests; nothing reaches `main` (and so production) until a
# person merges one. Updates are grouped weekly so they do not flood the review queue.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(infra)'
