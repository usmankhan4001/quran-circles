# Local development only. These credentials are not used anywhere else.
name: qc-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qc
      POSTGRES_DB: qc
    ports:
      - '5432:5432'
    volumes:
      - qc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qc -d qc']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qc-pgdata:
