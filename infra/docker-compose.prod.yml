# Production stack (WP10): reverse proxy, api, worker, Postgres and the poster renderer (WP16) on
# one host.
# Staging uses this same file with its own env file and project name; see infra/README.md.
#
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env config
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d
#
# Values come from the env file (template: infra/.env.example, names in infra/ENV.md). The env
# file stays on the server, mode 600, and is never committed.
#
# Networks: `edge` carries traffic from the proxy to the api and the worker and lets those two
# reach Meta, Google and Apple. `backend` is internal (no route out). Postgres is only on
# `backend` and publishes no port, so nothing outside this stack can reach it. `render` is internal
# too and holds only the poster renderer and its one caller, the worker: the renderer has no route
# out and cannot reach Postgres, publishes no port and is never routed by Caddy. The api only queues
# poster jobs through pg-boss, so it is not on `render` and has no renderer token (SEC-17).
#
# Database roles (SEC-12, infra/postgres/roles.sql): no service connects as the superuser `qc`.
# On every `up`, the one-shot `db-roles` (as `qc`) creates or updates qc_migrator, qc_api and
# qc_worker, their passwords, ownership and grants; then `migrate` runs as qc_migrator (owner of the
# application schema), `pgboss-migrate` installs or upgrades pg-boss's schema as qc_worker (its
# owner), and the api (qc_api) and the worker (qc_worker) start with read and write rights only.
#
# Poster files live in the `poster-files` volume, mounted at POSTER_STORAGE_DIR in the worker
# (writes and deletes them) and read-only in the api (serves them). infra/backup/backup.sh
# includes it in the encrypted backups.

name: ${COMPOSE_PROJECT_NAME:-qc-prod}

# Container logs are rotated by Docker: at most 5 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'
    tag: '{{.Name}}'

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true

# Variables passed by name only: a variable that is not set (or commented out) in the env file
# stays unset in the container, so a provider default is never overridden by an empty string.
x-messaging-shared: &messaging-shared
  APP_ENV: ${APP_ENV:?set APP_ENV in the env file}
  PUBLIC_WEB_BASE: ${PUBLIC_WEB_BASE:?set PUBLIC_WEB_BASE in the env file}

# Poster renderer client settings for the worker, which calls the renderer. The renderer gets the
# same token. POSTER_STORAGE_DIR is where the poster-files volume is mounted (it exists in the
# image); the api sets it too, to serve the files.
x-poster-client: &poster-client
  RENDERER_URL: http://poster-renderer:8090
  RENDERER_TOKEN: ${RENDERER_TOKEN:?set RENDERER_TOKEN in the env file}
  POSTER_STORAGE_DIR: /var/lib/qc/posters

# One-shot services that run before the api and the worker on every `up`.
x-one-shot: &one-shot
  restart: 'no'
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp:size=16m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true

services:
  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    # Waits for the api only: the site and sign-in stay up even if the worker cannot start.
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      QC_DOMAIN: ${QC_DOMAIN:?set QC_DOMAIN in the env file}
      QC_CONSOLE_DOMAIN: ${QC_CONSOLE_DOMAIN:?set QC_CONSOLE_DOMAIN in the env file}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in the env file}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${QC_WWW_DIR:-/srv/qc/www}:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # The admin endpoint listens on localhost inside the container only.
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '${QC_PROXY_CPUS:-0.5}'
          memory: ${QC_PROXY_MEMORY:-256m}
    logging: *logging

  api:
    image: ${QC_IMAGE_REGISTRY:-qc}/api:${QC_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pgboss-migrate:
        condition: service_completed_successfully
    environment:
      <<: *messaging-shared
      DATABASE_URL: postgres://qc_api:${POSTGRES_API_PASSWORD:?set POSTGRES_API_PASSWORD in the env file}@postgres:5432/qc
      POSTER_STORAGE_DIR: /var/lib/qc/posters
      PORT: '3000'
      # Server processes in this container (node:cluster, apps/api/src/cluster.ts). One Node process
      # uses about one core, so keep it equal to QC_API_CPUS. Each has a pool of 10 connections.
      API_PROCESSES: ${API_PROCESSES:-2}
      # Behind Caddy, which replaces X-Forwarded-For with the real client address.
      TRUST_PROXY: 'true'
      AUTH_TRUST_PROXY: 'true'
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in the env file}
      CORS_ORIGINS:
      AUTH_FIXED_CODE:
      MESSAGING_MODE:
      CODE_DELIVERY_MODE:
      CODE_SMS_FALLBACK:
      CODE_VALIDITY_MINUTES:
      WHATSAPP_PHONE_NUMBER_ID:
      WHATSAPP_ACCESS_TOKEN:
      WHATSAPP_GRAPH_BASE_URL:
      WHATSAPP_API_VERSION:
      SMS_GATEWAY_URL:
      SMS_GATEWAY_KEY:
      SMS_SENDER:
    volumes:
      # Read-only: the api only serves poster files; the worker writes and deletes them.
      - poster-files:/var/lib/qc/posters:ro
    networks:
      - edge
      - backend
    <<: *hardening
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '${QC_API_CPUS:-2.0}'
          memory: ${QC_API_MEMORY:-1g}
    logging: *logging

  worker:
    image: ${QC_IMAGE_REGISTRY:-qc}/worker:${QC_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pgboss-migrate:
        condition: service_completed_successfully
    environment:
      <<: [*messaging-shared, *poster-client]
      DATABASE_URL: postgres://qc_worker:${POSTGRES_WORKER_PASSWORD:?set POSTGRES_WORKER_PASSWORD in the env file}@postgres:5432/qc
      # Serves /healthz (internal) and /webhooks/whatsapp (routed by Caddy).
      WORKER_HTTP_PORT: '8081'
      WORKER_WAKE_MS:
      WORKER_POLL_MS:
      # WhatsApp and SMS only; push has its own lane below.
      WORKER_SEND_CONCURRENCY:
      # Push lane (queue outbox-send-push) and the dispatcher's claim limits; defaults in infra/ENV.md.
      WORKER_PUSH_CONCURRENCY:
      WORKER_PUSH_BATCH_SIZE:
      WORKER_PUSH_PARALLEL:
      WORKER_PUSH_POLL_MS:
      WORKER_PUSH_MAX_IN_FLIGHT:
      WORKER_MESSAGE_MAX_IN_FLIGHT:
      WORKER_LEASE_MS:
      WORKER_BUSY_POLL_MS:
      OCCURRENCE_HORIZON_DAYS:
      # WhatsApp spend limits (SEC-02); the console's settings override them.
      WHATSAPP_DAILY_CAP:
      WHATSAPP_CITY_MONTHLY_BUDGET:
      WHATSAPP_BUDGET_ALERT_PERCENT:
      MESSAGING_MODE:
      CODE_DELIVERY_MODE:
      CODE_SMS_FALLBACK:
      CODE_VALIDITY_MINUTES:
      WHATSAPP_PHONE_NUMBER_ID:
      WHATSAPP_ACCESS_TOKEN:
      WHATSAPP_APP_SECRET:
      WHATSAPP_VERIFY_TOKEN:
      WHATSAPP_GRAPH_BASE_URL:
      WHATSAPP_API_VERSION:
      FCM_SERVICE_ACCOUNT_JSON:
      APNS_TEAM_ID:
      APNS_KEY_ID:
      APNS_PRIVATE_KEY:
      APNS_BUNDLE_ID:
      APNS_PRODUCTION:
      VAPID_SUBJECT:
      VAPID_PUBLIC_KEY:
      VAPID_PRIVATE_KEY:
      SMS_GATEWAY_URL:
      SMS_GATEWAY_KEY:
      SMS_SENDER:
    volumes:
      - poster-files:/var/lib/qc/posters
    networks:
      - edge
      - backend
      - render
    <<: *hardening
    # The runtime waits up to 20 s for in-flight sends before it closes.
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${QC_WORKER_CPUS:-1.0}'
          memory: ${QC_WORKER_MEMORY:-512m}
    logging: *logging

  # Poster renderer (WP16): headless Chromium behind a bearer token. Internal only: on `render`
  # (internal, no route out, no Postgres), no published port, not routed by Caddy. It returns the
  # files to the worker and writes nothing to disk except /tmp (Chromium's profile, HOME=/tmp).
  # Chromium runs without its own sandbox (Playwright's default in containers); the hardening
  # below, the internal-only network and the renderer's in-browser request blocking are the
  # isolation (docs/agents/status/renderer.md).
  poster-renderer:
    image: ${QC_IMAGE_REGISTRY:-qc}/poster-renderer:${QC_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: infra/docker/poster-renderer.Dockerfile
      target: poster-renderer
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in the env file}
      RENDERER_PORT: '8090'
      RENDERER_TOKEN: ${RENDERER_TOKEN:?set RENDERER_TOKEN in the env file}
      # QR codes point at the same public origin as the links in messages.
      PUBLIC_WEB_BASE: ${PUBLIC_WEB_BASE:?set PUBLIC_WEB_BASE in the env file}
      RENDER_CONCURRENCY: '2'
      RENDER_QUEUE_MAX: '8'
      RENDER_TIMEOUT_MS: '20000'
      BROWSER_HEAP_MB: '128'
      BROWSER_RECYCLE_AFTER: '100'
      RENDER_CACHE_BYTES: '67108864'
    networks:
      - render
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '${QC_RENDERER_CPUS:-1.0}'
          memory: ${QC_RENDERER_MEMORY:-768m}
          pids: 256
    logging: *logging

  # One-shot, as the superuser `qc`: creates or updates the database roles, their passwords,
  # ownership and grants (infra/postgres/roles.sql), then exits. Idempotent; runs on every `up`,
  # so a new server, an existing database and a restored one all end up the same.
  db-roles:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    # psql as qc runs roles.sql; ON_ERROR_STOP makes any failure stop `up`.
    command:
      [psql, -X, -q, -v, ON_ERROR_STOP=1, -h, postgres, -U, qc, -d, qc, -f, /etc/qc/roles.sql]
    # The image's postgres user (uid 70); psql needs no root.
    user: '70:70'
    <<: *one-shot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD in the env file}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?set POSTGRES_API_PASSWORD in the env file}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?set POSTGRES_WORKER_PASSWORD in the env file}
    volumes:
      - ./postgres/roles.sql:/etc/qc/roles.sql:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128m
    logging: *logging

  # One-shot: applies pending SQL migrations as qc_migrator, then exits. `up` runs it before the
  # api and the worker start, so a fresh server and every deploy get the current schema.
  migrate:
    image: ${QC_IMAGE_REGISTRY:-qc}/api:${QC_IMAGE_TAG:-local}
    command: ['node', 'dist/migrate.mjs']
    <<: *one-shot
    depends_on:
      db-roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://qc_migrator:${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD in the env file}@postgres:5432/qc
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    logging: *logging

  # One-shot: installs pg-boss's schema on a new database, or upgrades it after a pg-boss update, as
  # qc_worker (the schema's owner), with pg-boss's own CLI (dist/pgboss.mjs in the worker image).
  # Running it before the api and the worker means neither ever needs to change the schema at
  # start-up; the api could not (it has no DDL rights). Worker images built before this step have
  # no dist/pgboss.mjs; it is skipped for them, so `deploy.sh --rollback` to such a tag still works
  # (the schema is installed by then).
  pgboss-migrate:
    image: ${QC_IMAGE_REGISTRY:-qc}/worker:${QC_IMAGE_TAG:-local}
    command:
      - sh
      - -c
      - if [ -f dist/pgboss.mjs ]; then exec node dist/pgboss.mjs migrate; fi; echo 'pgboss-migrate:' no dist/pgboss.mjs in this image, skipped
    <<: *one-shot
    depends_on:
      db-roles:
        condition: service_completed_successfully
    environment:
      PGBOSS_DATABASE_URL: postgres://qc_worker:${POSTGRES_WORKER_PASSWORD:?set POSTGRES_WORKER_PASSWORD in the env file}@postgres:5432/qc
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    logging: *logging

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_USER: qc
      POSTGRES_DB: qc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_INITDB_ARGS: --data-checksums
    # Statement statistics (pg_stat_statements, Gate 5 load test): which queries take the time.
    # Loaded at server start; `track=top` counts the statements clients send, not those inside
    # functions, and utility commands (BEGIN, SET, ...) are left out, to keep it cheap. `db-roles`
    # creates the view in the `postgres` database; read it as `qc` (infra/README.md, "Query
    # statistics"). Changing this line restarts Postgres on the next `up`.
    command:
      [
        postgres,
        -c,
        shared_preload_libraries=pg_stat_statements,
        -c,
        pg_stat_statements.track=top,
        -c,
        pg_stat_statements.track_utility=off,
      ]
    # No `ports:` on purpose. Backups run pg_dump inside this container (infra/backup/), as `qc`.
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    shm_size: 256m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U qc -d qc']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${QC_POSTGRES_CPUS:-1.5}'
          memory: ${QC_POSTGRES_MEMORY:-1g}
    logging: *logging

networks:
  edge:
  backend:
    internal: true
  render:
    internal: true

volumes:
  pgdata:
  poster-files:
  caddy-data:
  caddy-config:
