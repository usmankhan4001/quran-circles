# Rotation for the cron job logs in /var/log/qc. Container logs are rotated by Docker itself
# (json-file driver, 5 x 10 MB per container, set in docker-compose.prod.yml).
#
# Install: sudo install -m 644 infra/monitoring/logrotate.conf /etc/logrotate.d/qc
/var/log/qc/*.log {
	weekly
	rotate 8
	compress
	delaycompress
	missingok
	notifempty
	create 0640 root adm
}
